<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const W=cv.width, H=cv.height, GROUND=H-70;
// walkable depth band (Golden-Axe style): feet can roam between far and near
const FAR_Y=H-118, NEAR_Y=H-22;
function depthScale(y){ return 0.82 + 0.34*((y-FAR_Y)/(NEAR_Y-FAR_Y)); }  // closer = bigger

let ATLAS, BGS={}, FXC=null, FXB=null, bursts=[], holdCharge=false;

// ---- hero + enemy definitions ----
const HERO={

};
const CAT={
  keeper:{grp:'cat',key:'keeper',target:140,hp:3,coin:18,dmg:8,speed:1.6,ranged:true,rcol:'#e8f0ff',anims:{walk:[0,1,2,3],attack:[4,5,6,7],hurt:[8,9,10,11],dead:[7]}},
  striker:{grp:'cat',key:'striker',target:132,hp:2,coin:10,dmg:6,speed:1.7,anims:{walk:[0,1,2,3],attack:[4,5,6,7],hurt:[8,9,10,11],dead:[7]}},
  defender:{grp:'cat',key:'defender',target:152,hp:6,coin:26,dmg:12,speed:1.0,anims:{walk:[0,1,2,3],attack:[4,5,6,7],hurt:[8,9,10,11],dead:[7]}},
  winger:{grp:'cat',key:'winger',target:140,hp:3,coin:18,dmg:9,speed:2.3,anims:{walk:[0,1,2,3],attack:[4,5,6,7],hurt:[8,9,10,11],dead:[7]}}
};

const BOSS={
  starstriker:{grp:'bosses',key:'starstriker',name:'THE STAR STRIKER',target:255,hp:55,coin:120,dmg:15,speed:1.5,anims:{idle:[0],walk:[1,2,3],attack:[4,5,6],dead:[6]}},
  thewall:{grp:'bosses',key:'thewall',name:'THE WALL',target:270,hp:75,coin:180,dmg:17,speed:1.2,anims:{idle:[0],walk:[1,2,3],attack:[4,5,6],dead:[6]}},

  messi:{grp:'bosses',key:'messi',name:'MESSI · THE G.O.A.T.',target:360,hp:320,coin:1500,dmg:30,speed:2.1,anims:{idle:[0],walk:[1,2,3],attack:[4,5,6],dead:[6]}}
};
const STAGES=[

  {bg:'pitch',name:'⚽ PHASE 2 · THE WORLD STAGE',mobs:['winger','defender','winger','striker'],quota:16,boss:'thewall',teaser:'PHASE 2! Beating the Trophy only summoned the real challenge. The soccer world sends its finest — clear the pitch, the G.O.A.T. is warming up.'},

];

function frame(grp,key,i){
  const rows=ATLAS[grp]; if(!rows||!rows[key])return null;
  const list=rows[key]; const f=list[Math.min(i,list.length-1)];
  return f?{img:imgCache[f.file],w:f.w,h:f.h}:null;
}
// per-image opaque bounds (character shape, not the padded square cell)
// per-image opaque alpha mask — collisions test the actual non-transparent pixels
const HB={};
function computeHB(img){
  const w=img.width,h=img.height;
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d'); x.drawImage(img,0,0);
  const d=x.getImageData(0,0,w,h).data;
  const mask=new Uint8Array(w*h);
  for(let i=0;i<w*h;i++) if(d[i*4+3]>40) mask[i]=1;
  let x0=w,y0=h,x1=0,y1=0;
  for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){ if(mask[yy*w+xx]){ if(xx<x0)x0=xx; if(xx>x1)x1=xx; if(yy<y0)y0=yy; if(yy>y1)y1=yy; } }
  return {w,h,mask,bounds:{x0,y0,x1:x1+1,y1:y1+1}};
}
// get the HB (mask) entry for an entity's current frame
function frameHB(def,anim,frameIdx){
  const list=def.anims[anim]||def.anims.idle||def.anims.walk;
  const rows=ATLAS[def.grp]; const arr=rows&&rows[def.key]; if(!arr)return null;
  const idx=list[frameIdx%list.length]; const f=arr[Math.min(idx,arr.length-1)];
  return f?HB[f.file]:null;
}
// PIXEL-PERFECT overlap: true if any opaque pixel of A overlaps an opaque pixel of B.
// A/B = {def,anim,frame,x,footY,scale,flip}. Returns null if masks unavailable.
function pixelHit(A,B){
  const ma=frameHB(A.def,A.anim,A.frame), mb=frameHB(B.def,B.anim,B.frame);
  if(!ma||!ma.mask||!mb||!mb.mask) return null;
  const step=2;
  for(let py=0;py<mb.h;py+=step){
    for(let px=0;px<mb.w;px+=step){
      if(!mb.mask[py*mb.w+px]) continue;
      let lx=px-mb.w/2; if(B.flip)lx=-lx;
      const X=B.x+lx*B.scale, Y=B.footY-(mb.h-py)*B.scale;   // B pixel -> world
      let ax=(X-A.x)/A.scale; if(A.flip)ax=-ax; ax+=ma.w/2;   // world -> A pixel
      const ay=(Y-A.footY)/A.scale+ma.h;
      const axi=ax|0, ayi=ay|0;
      if(axi>=0&&axi<ma.w&&ayi>=0&&ayi<ma.h&&ma.mask[ayi*ma.w+axi]) return true;
    }
  }
  return false;
}
// is a world point inside an entity's opaque pixels?
function pointHit(def,anim,frameIdx,ex,efootY,scale,flip,X,Y){
  const m=frameHB(def,anim,frameIdx); if(!m||!m.mask) return null;
  let ax=(X-ex)/scale; if(flip)ax=-ax; ax+=m.w/2;
  const ay=(Y-efootY)/scale+m.h; const xi=ax|0, yi=ay|0;
  return xi>=0&&xi<m.w&&yi>=0&&yi<m.h ? !!m.mask[yi*m.w+xi] : false;
}
function scaleFor(def){ const a=def.anims.idle||def.anims.walk; const f=frame(def.grp,def.key,a[0]); return f?def.target/f.h:0.5; }
const tintCanvas=document.createElement('canvas');
function drawSprite(def,animName,frameIdx,x,footY,faceLeft,scale,alpha=1,tint=null,tilt=0){
  const list=def.anims[animName]||def.anims.idle||def.anims.walk;
  const idx=list[frameIdx%list.length];
  const fr=frame(def.grp,def.key,idx); if(!fr||!fr.img)return;
  const w=fr.w*scale,h=fr.h*scale;
  ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,footY);
  if(tilt)ctx.rotate(tilt);
  if(faceLeft)ctx.scale(-1,1);
  ctx.drawImage(fr.img,-w/2,-h,w,h);
  ctx.restore();
  if(tint){
    // tint ONLY the character's opaque pixels — build a silhouette on an
    // offscreen canvas (source-atop there only touches the sprite, not the bg)
    tintCanvas.width=fr.w; tintCanvas.height=fr.h;
    const oc=tintCanvas.getContext('2d');
    oc.clearRect(0,0,fr.w,fr.h);
    oc.drawImage(fr.img,0,0);
    oc.globalCompositeOperation='source-atop';
    oc.fillStyle=tint.c; oc.fillRect(0,0,fr.w,fr.h);
    oc.globalCompositeOperation='source-over';
    ctx.save();ctx.globalAlpha=alpha*tint.a;ctx.translate(x,footY);
    if(tilt)ctx.rotate(tilt);
    if(faceLeft)ctx.scale(-1,1);
    ctx.drawImage(tintCanvas,-w/2,-h,w,h);
    ctx.restore();
  }
}


function bossFace(def){ const list=def.anims.idle||def.anims.walk||[0];
  const arr=ATLAS[def.grp]&&ATLAS[def.grp][def.key]; if(!arr)return null;
  const f=arr[Math.min(list[0],arr.length-1)]; if(!f)return null;
  const img=imgCache[f.file]; if(!img)return null;
  const hb=HB[f.file]; let x0=0,y0=0,x1=f.w,y1=f.h;
  if(hb&&hb.bounds){x0=hb.bounds.x0;y0=hb.bounds.y0;x1=hb.bounds.x1;y1=hb.bounds.y1;}
  const bw=x1-x0,bh=y1-y0,sd=Math.max(8,Math.min(bw,bh*0.9));
  return {img,sx:x0+(bw-sd)/2,sy:y0,sd};
}
function drawBossBar(def,hp,maxhp){
  const r=26,gap=12,bw=Math.min(430,W-150),bh=15;
  const totalW=r*2+gap+bw, gx=(W-totalW)/2, cx=gx+r, cy=r+11; const bx=gx+r*2+gap, by=cy-bh/2+3;
  ctx.textAlign='left'; ctx.fillStyle='#ffe08a';ctx.font='900 12px Trebuchet MS'; ctx.fillText('👑 '+def.name, bx, by-6);
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(bx-2,by-2,bw+4,bh+4); ctx.fillStyle='#3a0d0d';ctx.fillRect(bx,by,bw,bh);
  const frac=Math.max(0,hp)/maxhp; const grd=ctx.createLinearGradient(bx,0,bx+bw,0); grd.addColorStop(0,'#ff2f5f'); grd.addColorStop(1,'#ff9a3b');
  ctx.fillStyle=grd;ctx.fillRect(bx,by,bw*frac,bh);
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1; for(let i=1;i<12;i++){const xx=bx+bw*i/12;ctx.beginPath();ctx.moveTo(xx,by);ctx.lineTo(xx,by+bh);ctx.stroke();}
  ctx.strokeStyle='#ffcc44';ctx.lineWidth=2;ctx.strokeRect(bx,by,bw,bh);
  const fc=bossFace(def); ctx.save(); ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.closePath(); ctx.fillStyle='#160f28';ctx.fill(); ctx.save();ctx.clip();
  if(fc){ ctx.imageSmoothingEnabled=false; ctx.drawImage(fc.img,fc.sx,fc.sy,fc.sd,fc.sd, cx-r,cy-r+2, r*2,r*2); }
  ctx.restore(); ctx.lineWidth=3;ctx.strokeStyle='#ffcc44';ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.stroke(); ctx.restore(); ctx.textAlign='left';
}


function drawFoeProj(X,Y,col){ col=col||'#ff5a5a';

  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(6,10,22,.10)');
  g.addColorStop(.7,'rgba(6,10,22,.28)');g.addColorStop(1,'rgba(4,6,12,.8)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.lineWidth=2;ctx.strokeStyle=stroke;ctx.stroke();}}
function drawHUD(){

  ctx.fillStyle='#ffcc44';ctx.font='bold 12px Trebuchet MS';

  // stage tag

  const st=STAGES[stageIdx];const prog=bossOut?'BOSS':Math.min(killed,st.quota)+'/'+st.quota;
  const _lbl='STAGE '+(stageIdx+1)+'  '+st.name+'  ['+prog+']';

  if(combo>=2){ ctx.save(); ctx.globalAlpha=Math.min(1,comboT/280+.35); ctx.fillStyle='#ffcc44';
    ctx.font='900 '+(19+Math.min(combo,18))+'px Trebuchet MS'; ctx.textAlign='center';
    ctx.strokeStyle='rgba(0,0,0,.6)'; ctx.lineWidth=4; ctx.strokeText(combo+' HITS!',W/2,86); ctx.fillText(combo+' HITS!',W/2,86);
    ctx.textAlign='left'; ctx.restore(); }
  // difficulty tag
  ctx.fillStyle='#ff6b8a'; ctx.font='bold 14px Trebuchet MS'; ctx.fillText((lives>0?'\u2665'.repeat(lives):'')+ (lives<=0?'':''), 176, 47);
  ctx.font='18px serif'; ctx.textAlign='left'; ctx.fillText(muted?'\ud83d\udd07':'\ud83d\udd0a', W-42, 64);
  ctx.fillStyle='#8f86b0'; ctx.font='bold 10px Trebuchet MS'; ctx.fillText(DIFF.name,W-52-ctx.measureText(DIFF.name).width,44);
  if(bannerT>0){ctx.globalAlpha=Math.min(1,bannerT/300);ctx.fillStyle='#ffe08a';ctx.font='900 30px Trebuchet MS';

// ---- stage flow ----
let spawnT=800;
function showStageIntro(idx){ intro={idx:idx,t:0,blink:0}; SFX.boss(); }
function beginStage(idx){
  intro=null; stageIdx=idx; killed=0; enemies=[]; projectiles=[]; drops=[]; floats=[]; combo=0; bossOut=false; stageClearing=false;
  camX=0; player.x=180; player.y=(FAR_Y+NEAR_Y)/2; player.hp=Math.min(player.maxhp,player.hp+ (idx>0?35:0));
  banner='STAGE '+(idx+1)+' — '+STAGES[idx].name; bannerT=1500; spawnT=900;
}
function drawIntro(){
  const st=STAGES[intro.idx], BG=BGS[st.bg];
  if(BG){const sc=H/BG.height*1.12,tw=BG.width*sc,th=BG.height*sc; for(let x=-tw;x<W+tw;x+=tw)ctx.drawImage(BG,x,-16,tw,th);}
  else{ctx.fillStyle='#0d1524';ctx.fillRect(0,0,W,H);}
  ctx.fillStyle='rgba(6,4,14,.62)';ctx.fillRect(0,0,W,H);
  // vignette
  const vg=ctx.createRadialGradient(W/2,H/2,120,W/2,H/2,W*0.7); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.7)'); ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  // boss portrait right side, red glow
  const bdef=BOSS[st.boss], fr=frame(bdef.grp,bdef.key,(bdef.anims.idle||[0])[0]);
  const bx=W*0.74, by=H*0.60+Math.sin(intro.t/500)*4;
  const gl=ctx.createRadialGradient(bx,by-70,10,bx,by-70,180); gl.addColorStop(0,'rgba(255,60,90,.4)'); gl.addColorStop(1,'transparent'); ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(bx,by-70,180,0,7); ctx.fill();
  if(fr&&fr.img){ const s=Math.min(320/fr.h, 3); const w=fr.w*s,h=fr.h*s; ctx.save(); ctx.shadowColor='rgba(0,0,0,.6)'; ctx.shadowBlur=20; ctx.drawImage(fr.img,bx-w/2,by-h,w,h); ctx.restore(); }
  // text left
  ctx.textAlign='left';
  ctx.fillStyle='#ff5a7a'; ctx.font='900 15px Trebuchet MS'; ctx.fillText('⚠ STAGE '+(intro.idx+1)+' OF '+STAGES.length, 46, 120);
  ctx.fillStyle='#ffe08a'; ctx.font='900 36px Trebuchet MS'; ctx.fillText(st.name, 44, 162);
  ctx.fillStyle='#ff8fb0'; ctx.font='bold 14px Trebuchet MS'; ctx.fillText('BOSS AHEAD:  '+bdef.name, 46, 190);
  // teaser wrapped
  ctx.fillStyle='#dfe4f2'; ctx.font='15px Trebuchet MS';
  const words=(st.teaser||'').split(' '); let line='',yy=228;
  for(const wd of words){ if(ctx.measureText(line+wd).width>430){ctx.fillText(line,46,yy);line=wd+' ';yy+=22;} else line+=wd+' '; }
  ctx.fillText(line,46,yy);
  // prompt
  if(Math.floor(intro.t/450)%2){ ctx.fillStyle='#ffcc44'; ctx.font='900 18px Trebuchet MS'; ctx.fillText('▶ PRESS ENTER / CLICK TO BEGIN', 46, H-44); }
  ctx.textAlign='left';
}
function onBossDown(){
  banner='BOSS DEFEATED!';bannerT=1400;stageClearing=true;
  setTimeout(()=>{
    if(stageIdx>=STAGES.length-1){victory();}
    else{ enemies=[];projectiles=[];drops=[]; stageClearing=false; showStageIntro(stageIdx+1); }
  },1500);
}
function tickSpawns(dt){
  const st=STAGES[stageIdx];
  if(bossOut||stageClearing)return;
  if(killed>=st.quota){ // summon boss
    if(!enemies.some(e=>e.isBoss)&&enemies.filter(e=>!e.dead).length===0){
      bossOut=true;banner='⚠ BOSS: '+BOSS[st.boss].name;bannerT=1700;sfxFlash('#ff2f6b');shakeT=300;
      spawnEnemy(st.boss,true);}
    return;
  }
  spawnT-=dt;
  if(spawnT<=0&&enemies.filter(e=>!e.dead).length<4){
    spawnEnemy(st.mobs[Math.floor(Math.random()*st.mobs.length)],false);
    spawnT=1300+Math.random()*800;
  }
}

// ---- main loop ----
function frameLoop(t){
  const dt=Math.min(40,t-last);last=t;
  if(intro){ intro.t+=dt; }
  if(started&&player&&!paused&&!intro){
    if(comboT>0){comboT-=dt; if(comboT<=0)combo=0;}
    if(flash>0)flash-=dt; if(bannerT>0)bannerT-=dt; if(shakeT>0)shakeT-=dt;
    floats.forEach(fl=>{fl.y-=.5;fl.life-=dt;}); floats=floats.filter(fl=>fl.life>0);
    particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.2;p.life-=dt;}); particles=particles.filter(p=>p.life>0);
    bursts.forEach(bu=>bu.t+=dt); bursts=bursts.filter(bu=>bu.t<bu.dur);
    if(hitStop>0){ hitStop-=dt; }
    else {
      player.update(dt);
      camX=Math.max(0,player.x-W*0.32);
      tickSpawns(dt);
      enemies.forEach(e=>e.update(dt));
      enemies=enemies.filter(e=>!(e.dead&&e.deadT<=0));
      projectiles.forEach(p=>{ p.x+=p.dir*7.5; p.life-=dt; if(p.foe){ if(!player.dead&&player.inv<=0){ const ph=pointHit(player.def,player.state,player.frame,player.x,player.y-player.z,player.scale,player.face,p.x,p.y); const hit=ph!==null?ph:(Math.abs(player.x-p.x)<30&&Math.abs(player.y-p.gy)<48); if(hit){ player.hp-=p.dmg; player.inv=350; spark(player.x,player.y-60,'#ff5a5a'); shakeT=140; combo=0; SFX.hurt(); addFloat(player.x,player.y-70,'-'+p.dmg,'#ff6b6b'); p.life=0; } } return; }
        for(const e of enemies){ if(e.dead)continue;
          const ph=pointHit(e.def,e.state,e.frame,e.x,e.y,e.scale,player.x<e.x,p.x,p.y);
          const hit = ph!==null? ph : Math.abs(e.x-p.x)<40;
          if(hit && Math.abs(e.y-p.gy)<(p.big?64:44)){
            if(p.blast){ for(const e2 of enemies){ if(e2.dead)continue; if(Math.abs(e2.x-p.x)<150&&Math.abs(e2.y-p.gy)<84){ e2.hurt(p.dmg); e2.kb=Math.sign((e2.x-p.x)||1)*11; } }
              for(let i=0;i<26;i++)particles.push({x:p.x+(Math.random()-.5)*100,y:p.gy-30-Math.random()*80,vx:(Math.random()-.5)*6,vy:-Math.random()*6,life:520,c:i%2?'#ff7a1e':'#ffd24a'});
              sfxFlash('#ff7a1e'); shakeT=Math.max(shakeT,240); SFX.hit(); p.life=0; break; }
            e.hurt(p.dmg); p.life=0; spark(p.x,p.y,p.big?'#ffd24a':'#7cff9a'); break; } } });
      projectiles=projectiles.filter(p=>p.life>0 && p.x>camX-60 && p.x<camX+W+60);
      drops.forEach(p=>{ p.t+=dt; if(p.z>0){p.vz-=0.5;p.z+=p.vz; if(p.z<0){p.z=0;p.vz=0;}} p.life-=dt;
        if(!player.dead && Math.abs(player.x-p.x)<46 && Math.abs(player.y-p.y)<42){ collectItem(p); p.life=0; } });
      drops=drops.filter(p=>p.life>0);
      if(player.hp<=0&&!player.dead){loseLife();}
    }
  }
  drawBG();
  const all=[...enemies,player].filter(Boolean).sort((a,b)=>a.y-b.y);
  all.forEach(o=>o.draw());
  // item drops
  drops.forEach(p=>{ const X=sx(p.x),Y=p.y-p.z, bob=Math.sin(p.t/200)*3;
    ctx.save(); ctx.globalAlpha=.4; ctx.fillStyle='#000'; ctx.beginPath(); ctx.ellipse(X,p.y+2,14,5,0,0,7); ctx.fill(); ctx.restore();
    ctx.save(); ctx.globalAlpha=p.life<1600?Math.max(.25,(Math.floor(p.life/120)%2?1:.45)):1;
    ctx.font='26px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowColor=ITEMS[p.k].col; ctx.shadowBlur=12; ctx.fillText(ITEMS[p.k].emoji,X,Y-16+bob);
    ctx.shadowBlur=0; ctx.textAlign='left'; ctx.textBaseline='alphabetic'; ctx.restore(); });
  // draw magic bolts
  projectiles.forEach(p=>{ if(p.foe){drawFoeProj(sx(p.x),p.y,p.col);return;} const X=sx(p.x),Y=p.y,r=p.big?26:15,col=p.col||'#7cff9a';
    const g=ctx.createRadialGradient(X,Y,1,X,Y,r); g.addColorStop(0,'#ffffff'); g.addColorStop(.4,col); g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(X,Y,r,0,7); ctx.fill();
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(X,Y,r*0.45,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.7)'; ctx.beginPath(); ctx.arc(X-r*0.18,Y-r*0.18,r*0.16,0,7); ctx.fill(); });
  particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/400);ctx.fillStyle=p.c;ctx.fillRect(sx(p.x),p.y,3,3);ctx.globalAlpha=1;});
  bursts.forEach(bu=>{ if(!FXB)return; const fw=FXB.width/4, fi=Math.min(3,Math.floor(bu.t/bu.dur*3.99)), s2=bu.size*(1+bu.t/bu.dur*0.7), X=sx(bu.x),Y=bu.y; ctx.save(); ctx.globalAlpha=Math.max(0,1-bu.t/bu.dur*0.9); ctx.drawImage(FXB,fi*fw,0,fw,FXB.height,X-s2/2,Y-s2/2,s2,s2); ctx.restore(); });
  if(flash>0){ctx.save();ctx.globalAlpha=flash/220*0.45;ctx.fillStyle=flashC;ctx.fillRect(0,0,W,H);ctx.restore();}
  floats.forEach(fl=>{ ctx.save(); ctx.globalAlpha=Math.max(0,fl.life/900); ctx.fillStyle=fl.col;
    ctx.font='bold 15px Trebuchet MS'; ctx.textAlign='center'; ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,.6)';
    ctx.strokeText(fl.txt,sx(fl.x),fl.y); ctx.fillText(fl.txt,sx(fl.x),fl.y); ctx.textAlign='left'; ctx.restore(); });
  if(intro){ drawIntro(); }
  if(started&&player&&!intro)drawHUD();
  if(paused&&started){ ctx.save(); ctx.fillStyle='rgba(6,4,14,.72)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffe08a'; ctx.font='900 40px Trebuchet MS'; ctx.textAlign='center'; ctx.fillText('⏸ PAUSED',W/2,H/2-6);
    ctx.fillStyle='#cbd0e0'; ctx.font='14px Trebuchet MS'; ctx.fillText('press P to resume',W/2,H/2+26); ctx.textAlign='left'; ctx.restore(); }
  requestAnimationFrame(frameLoop);
}

function heroPreview(hkey,size){
  const c=document.createElement('canvas');c.width=size;c.height=size;const x=c.getContext('2d');
  x.imageSmoothingEnabled=false;const def=HERO[hkey];const fr=frame(def.grp,def.key,def.anims.idle[0]);
  if(fr&&fr.img){const s=size*0.9/fr.h,w=fr.w*s,h=fr.h*s;x.drawImage(fr.img,(size-w)/2,size-h-4,w,h);}
  return c;
}

function startGame(hk){
  try{const a=ac();if(a&&a.state==='suspended')a.resume();}catch(e){}
  if(bestiaryAnim){clearInterval(bestiaryAnim);bestiaryAnim=null;}
  player=makePlayer(hk);enemies=[];particles=[];projectiles=[];drops=[];floats=[];combo=0;comboT=0;hitStop=0;paused=false;
  camX=0;stageIdx=0;killed=0;bossOut=false;stageClearing=false;lives=3;
  overlay.style.display='none';started=true; showStageIntro(0);
}
function loseLife(){ lives--; 
  if(lives>0){ player.hp=player.maxhp; player.inv=1700; player.dead=false; player.x=Math.max(80,camX+90); player.y=(FAR_Y+NEAR_Y)/2;
    banner='LIFE LOST · '+lives+' LEFT'; bannerT=1500; sfxFlash('#ff3b6b'); shakeT=220; SFX.hurt();
    enemies.forEach(e=>{ if(!e.dead){ e.stun=420; e.kb=Math.sign((e.x-player.x)||1)*11; } }); }
  else { player.dead=true; gameOver(); } }
function gameOver(){setTimeout(()=>{started=false;overlay.style.display='flex';
  $('ovTitle').textContent='GAME OVER — YOU GOT BENCHED';
  $('ovText').innerHTML='Score: <b>'+player.score+'</b> · Carrots: <b>'+player.coins+'</b> · Reached Stage <b>'+(stageIdx+1)+'</b>';
  $('ovBody').innerHTML='<button class="btn" onclick="location.reload()">TRY AGAIN</button>';},700);}
function victory(){started=false;overlay.style.display='flex';
  $('ovTitle').innerHTML='🏆 CHAMPIONS! 🏆';
  $('ovText').innerHTML=player.def.name+' posterized <b>MESSI, the G.O.A.T.</b> and won it all — undisputed champion!<br>Final Score: <b>'+player.score+'</b> · Carrots: <b>'+player.coins+'</b>';
  $('ovBody').innerHTML='<button class="btn" onclick="location.reload()">PLAY AGAIN</button>';}

// ---- boot ----
async function boot(){
  ATLAS=await fetch('assets/sprites/atlas.json?t='+Date.now()).then(r=>r.json());
  for(const s of STAGES){BGS[s.bg]=await load('assets/bg/'+s.bg+'.png');}
  const files=new Set();
  for(const grp of Object.keys(ATLAS))for(const k in ATLAS[grp])ATLAS[grp][k].forEach(f=>files.add(f.file));
  await Promise.all([...files].map(async f=>{const im=await load('assets/sprites/'+f);imgCache[f]=im; if(im)HB[f]=computeHB(im);}));
  FXC=await load('assets/fx/charge_fx.png'); FXB=await load('assets/fx/burst_fx.png');
  charSelect();
  fitCanvas();
  requestAnimationFrame(frameLoop);
}
// ---- mobile touch controls ----
(function(){
  if(!('ontouchstart' in window) && !(navigator.maxTouchPoints>0)) return;
  document.body.classList.add('touch');
  function hold(el,on,off){ if(!el)return;
    el.addEventListener('touchstart',function(e){e.preventDefault();on();},{passive:false});
    el.addEventListener('touchend',function(e){e.preventDefault();off&&off();},{passive:false});
    el.addEventListener('touchcancel',function(e){off&&off();}); }
  document.querySelectorAll('#dpad .tb').forEach(function(b){ var k=b.dataset.k; hold(b,function(){keys[k]=true;},function(){keys[k]=false;}); });
  hold(document.getElementById('tJmp'),function(){keys[' ']=true;},function(){keys[' ']=false;});
  var atk=document.getElementById('tAtk'); if(atk)atk.addEventListener('touchstart',function(e){e.preventDefault(); if(intro){beginStage(intro.idx);return;} player&&player.attack();},{passive:false});
  var sp=document.getElementById('tSp'); if(sp)sp.addEventListener('touchstart',function(e){e.preventDefault(); player&&player.special();},{passive:false});
  cv.addEventListener('touchstart',function(e){ if(intro){e.preventDefault(); beginStage(intro.idx);} },{passive:false});
  setInterval(function(){ var t=document.getElementById('touch'); if(t)t.style.visibility=(overlay.style.display==='none'?'visible':'hidden'); },120);
})();
try{STAGES.forEach((s,i)=>{ if(i>=1 && s.mobs && !s.mobs.includes('keeper')) s.mobs.push('keeper'); });}catch(e){}
boot();
</script>
