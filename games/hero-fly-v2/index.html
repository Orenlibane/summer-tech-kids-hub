<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Super Hero Fly v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --pink:#ff5da2;
    --blue:#3aa0ff;
    --yellow:#ffd23f;
    --purple:#7b5cff;
    --dark:rgba(20,16,45,.62);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:#0b1026;font-family:'Baloo 2',system-ui,sans-serif;}
  #game{position:fixed;inset:0;display:block;touch-action:none;cursor:pointer;}

  .hud{position:fixed;top:0;left:0;right:0;padding:14px;display:flex;justify-content:center;pointer-events:none;z-index:5;}
  .hud .scoreCard{
    background:var(--dark);backdrop-filter:blur(6px);
    border-radius:22px;padding:8px 20px;color:#fff;
    display:flex;gap:22px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25);
  }
  .hud .num{font-weight:800;font-size:clamp(20px,5vw,30px);line-height:1;}
  .hud .lbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.8;font-weight:700;}
  .hud .col{display:flex;flex-direction:column;align-items:center;}
  .hud .best .num{color:var(--yellow);}

  .pill{
    position:fixed;top:14px;z-index:6;pointer-events:auto;
    background:var(--dark);backdrop-filter:blur(6px);
    color:#fff;text-decoration:none;font-weight:700;
    padding:9px 16px;border-radius:999px;font-size:15px;
    display:flex;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(0,0,0,.25);
    transition:transform .15s ease, background .15s ease;
  }
  .pill:active{transform:scale(.94);}
  #hubLink{left:14px;}
  #muteBtn{left:14px;top:60px;border:none;cursor:pointer;font-family:inherit;}
  .badge{
    right:14px;background:linear-gradient(135deg,var(--pink),var(--purple));
    color:#fff;font-weight:800;padding:8px 15px;border-radius:999px;font-size:15px;
    box-shadow:0 6px 18px rgba(123,92,255,.5);
  }

  .overlay{
    position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
    padding:20px;pointer-events:none;
  }
  .card{
    pointer-events:auto;background:#fff;border:6px solid var(--purple);
    border-radius:30px;padding:30px 34px;text-align:center;max-width:360px;width:100%;
    box-shadow:0 22px 60px rgba(0,0,0,.4);
    animation:pop .4s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop{from{transform:scale(.7) translateY(20px);opacity:0;}to{transform:none;opacity:1;}}
  .card h1{font-size:34px;font-weight:800;color:var(--purple);line-height:1.05;margin-bottom:4px;}
  .card .emoji{font-size:52px;margin-bottom:6px;line-height:1;}
  .card p{color:#5a5470;font-weight:600;font-size:15px;margin:10px 0 20px;}
  .card .stats{display:flex;justify-content:center;gap:26px;margin:14px 0 20px;}
  .card .stats .col .num{font-size:30px;font-weight:800;color:var(--pink);}
  .card .stats .best .num{color:var(--yellow);}
  .card .stats .lbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#8a86a0;font-weight:700;}
  .newbest{color:var(--yellow);font-weight:800;font-size:18px;margin-bottom:10px;display:none;
    text-shadow:0 2px 0 rgba(0,0,0,.06);animation:wobble 1s ease-in-out infinite;}
  @keyframes wobble{0%,100%{transform:rotate(-3deg) scale(1);}50%{transform:rotate(3deg) scale(1.08);}}
  .btn{
    font-family:inherit;font-weight:800;font-size:22px;color:#fff;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--pink),var(--purple));
    padding:15px 36px;border-radius:999px;box-shadow:0 8px 0 #5a3ecf, 0 12px 24px rgba(123,92,255,.4);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .btn:active{transform:translateY(6px);box-shadow:0 2px 0 #5a3ecf,0 6px 12px rgba(123,92,255,.4);}
  .hide{display:none !important;}
</style>
</head>
<body>
<canvas id="game"></canvas>

<a id="hubLink" class="pill" href="../../index.html">← Hub</a>
<button id="muteBtn" class="pill" aria-label="Toggle sound">🔊 Sound</button>
<div class="badge pill" style="pointer-events:none;">v2</div>

<div class="hud">
  <div class="scoreCard">
    <div class="col"><span class="num" id="hudScore">0</span><span class="lbl">Score</span></div>
    <div class="col best"><span class="num" id="hudBest">0</span><span class="lbl">Best</span></div>
  </div>
</div>

<!-- Start card -->
<div class="overlay" id="startOverlay">
  <div class="card">
    <div class="emoji">🦸</div>
    <h1>Super Hero Fly</h1>
    <p>Hold <b>tap</b>, <b>click</b> or <b>SPACE</b> to fly up.<br>Grab ⭐ stars, dodge the storms!</p>
    <button class="btn" id="startBtn">▶ Play</button>
  </div>
</div>

<!-- Game over card -->
<div class="overlay hide" id="overOverlay">
  <div class="card">
    <div class="emoji">💥</div>
    <h1>Game Over</h1>
    <div class="newbest" id="newBest">✨ New best! ✨</div>
    <div class="stats">
      <div class="col"><span class="num" id="overScore">0</span><span class="lbl">Score</span></div>
      <div class="col best"><span class="num" id="overBest">0</span><span class="lbl">Best</span></div>
    </div>
    <button class="btn" id="againBtn">▶ Play again</button>
  </div>
</div>

<script>
(function(){
"use strict";

/* ---------- Canvas setup ---------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, window.innerWidth);
  H = Math.max(1, window.innerHeight);
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildSkyline();
}
window.addEventListener('resize', resize);

/* ---------- Audio (WebAudio, no files) ---------- */
let audioCtx = null, muted = false;
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx = null; }
  }
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type, vol, slideTo){
  if(muted || !audioCtx) return;
  try{
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if(slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol||0.15, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }catch(e){}
}
const sfx = {
  thrust: ()=> beep(220, 0.09, 'sine', 0.05, 300),
  star:   ()=>{ beep(660,0.08,'triangle',0.16,990); setTimeout(()=>beep(990,0.09,'triangle',0.13,1320),60); },
  hit:    ()=>{ beep(180,0.3,'sawtooth',0.25,60); }
};

const muteBtn = document.getElementById('muteBtn');
muteBtn.addEventListener('click', (e)=>{
  e.preventDefault();
  muted = !muted;
  muteBtn.textContent = muted ? '🔇 Muted' : '🔊 Sound';
});

/* ---------- State ---------- */
const STATE = { MENU:0, PLAY:1, OVER:2 };
let state = STATE.MENU;

const hero = { x:0, y:0, vy:0, r:22, rot:0, alive:true };
let thrusting = false;
let scroll = 0;         // world scroll for parallax (px)
let speed = 220;        // base world speed px/s
let score = 0;
let best = 0;
let stars = [];
let hazards = [];
let particles = [];     // trail sparkles + bursts
let popups = [];        // "+1" floating text
let cape = [];          // cape trail segments (points behind hero)
let shake = 0;
let flash = 0;
let spawnStarT = 0;
let spawnHazT = 0;
let lastT = 0;
let elapsed = 0;
let grace = 0; // early invulnerability so the start feels fair

/* high score */
try{ best = parseInt(localStorage.getItem('heroFlyV2Best')||'0',10) || 0; }catch(e){ best = 0; }

/* ---------- Skyline (rebuilt on resize) ---------- */
let skyline = [];
function buildSkyline(){
  skyline = [];
  let x = -50;
  const base = H;
  while(x < W + 400){
    const bw = 40 + Math.random()*70;
    const bh = 80 + Math.random()*(H*0.32);
    skyline.push({x, w:bw, h:bh, base});
    x += bw + 8 + Math.random()*30;
  }
}

/* far clouds (persistent, drift) */
const farClouds = [];
for(let i=0;i<7;i++){
  farClouds.push({ x:Math.random(), y:0.12+Math.random()*0.4, s:0.6+Math.random()*0.9 });
}

/* ---------- Spawning ---------- */
function spawnStar(){
  const margin = 70;
  stars.push({
    x: W + 40,
    y: margin + Math.random()*(H - margin*2),
    r: 15,
    t: Math.random()*6.28,
    got:false
  });
}
function spawnHazard(){
  const margin = 60;
  const kind = Math.random() < 0.35 ? 'bird' : 'cloud';
  let hy = margin + Math.random()*(H - margin*2);
  // Early on, avoid spawning right in the hero's current lane (feels unfair).
  if(elapsed < 6 && Math.abs(hy - hero.y) < 130){
    hy = hero.y > H/2 ? margin + Math.random()*(H*0.35)
                      : H - margin - Math.random()*(H*0.35);
  }
  hazards.push({
    x: W + 60,
    y: hy,
    kind,
    r: kind==='bird' ? 20 : 34,
    t: Math.random()*6.28,
    bob: 20 + Math.random()*30,
    baseY: 0
  });
  hazards[hazards.length-1].baseY = hazards[hazards.length-1].y;
}

/* ---------- Reset ---------- */
function resetGame(){
  hero.x = W * 0.26;
  hero.y = H * 0.45;
  hero.vy = 0;
  hero.rot = 0;
  hero.alive = true;
  thrusting = false;
  scroll = 0;
  speed = 220;
  score = 0;
  elapsed = 0;
  stars = [];
  hazards = [];
  particles = [];
  popups = [];
  cape = [];
  shake = 0;
  flash = 0;
  spawnStarT = 0.4;
  spawnHazT = 2.6;
  grace = 1.6;
  for(let i=0;i<10;i++) cape.push({x:hero.x, y:hero.y});
  updateHUD();
}

/* ---------- Input ---------- */
function pressStart(){ ensureAudio(); thrusting = true; }
function pressEnd(){ thrusting = false; }

canvas.addEventListener('mousedown', e=>{ e.preventDefault(); pressStart(); });
window.addEventListener('mouseup', ()=> pressEnd());
canvas.addEventListener('touchstart', e=>{ e.preventDefault(); pressStart(); }, {passive:false});
canvas.addEventListener('touchend', e=>{ e.preventDefault(); pressEnd(); }, {passive:false});
canvas.addEventListener('touchcancel', ()=> pressEnd());
window.addEventListener('keydown', e=>{
  if(e.code === 'Space'){
    e.preventDefault();
    if(state === STATE.MENU) startGame();
    else if(state === STATE.OVER) startGame();
    else pressStart();
  }
});
window.addEventListener('keyup', e=>{ if(e.code === 'Space') pressEnd(); });

document.getElementById('startBtn').addEventListener('click', ()=> startGame());
document.getElementById('againBtn').addEventListener('click', ()=> startGame());

function startGame(){
  ensureAudio();
  resetGame();
  document.getElementById('startOverlay').classList.add('hide');
  document.getElementById('overOverlay').classList.add('hide');
  state = STATE.PLAY;
}

function gameOver(){
  if(state !== STATE.PLAY) return;
  state = STATE.OVER;
  hero.alive = false;
  sfx.hit();
  shake = 22; flash = 1;
  // burst
  for(let i=0;i<28;i++){
    particles.push({
      x:hero.x, y:hero.y,
      vx:(Math.random()-0.5)*360, vy:(Math.random()-0.5)*360,
      life:0.9, max:0.9, r:3+Math.random()*4,
      col:i%2? '#ff5da2':'#ffd23f', kind:'burst'
    });
  }
  const isNew = score > best;
  if(isNew){ best = score; try{ localStorage.setItem('heroFlyV2Best', String(best)); }catch(e){} }
  document.getElementById('overScore').textContent = score;
  document.getElementById('overBest').textContent = best;
  document.getElementById('newBest').style.display = isNew ? 'block' : 'none';
  updateHUD();
  document.getElementById('overOverlay').classList.remove('hide');
}

function updateHUD(){
  document.getElementById('hudScore').textContent = score;
  document.getElementById('hudBest').textContent = best;
}

/* ---------- Update ---------- */
function update(dt){
  if(state !== STATE.PLAY){
    // still animate particles on game over for the burst
    updateParticles(dt);
    if(shake > 0) shake = Math.max(0, shake - dt*40);
    if(flash > 0) flash = Math.max(0, flash - dt*2.2);
    return;
  }
  elapsed += dt;
  if(grace > 0) grace = Math.max(0, grace - dt);

  // difficulty ramp
  speed = 220 + Math.min(280, elapsed*7 + score*1.5);
  scroll += speed * dt;

  // hero physics
  const GRAV = 1500, LIFT = -2650;
  hero.vy += GRAV * dt;
  if(thrusting){
    hero.vy += LIFT * dt;
    // thrust sparkle trail
    if(Math.random() < 0.9){
      particles.push({
        x:hero.x-18, y:hero.y+6+ (Math.random()-0.5)*14,
        vx:-60-Math.random()*80, vy:(Math.random()-0.5)*40,
        life:0.5, max:0.5, r:2+Math.random()*3,
        col: Math.random()<0.5?'#ffd23f':'#8fd0ff', kind:'trail'
      });
    }
    if(Math.random() < 0.12) sfx.thrust();
  }
  hero.vy = Math.max(-620, Math.min(760, hero.vy));
  hero.y += hero.vy * dt;
  hero.rot = Math.max(-0.5, Math.min(0.6, hero.vy/900));

  // bounds
  if(hero.y < hero.r){ hero.y = hero.r; hero.vy = Math.max(0, hero.vy); }
  if(hero.y > H - hero.r){ gameOver(); return; }

  // cape trail (follow-the-leader)
  cape.unshift({x:hero.x-14, y:hero.y+4});
  if(cape.length > 12) cape.pop();

  // spawn
  spawnStarT -= dt;
  spawnHazT -= dt;
  const hazInterval = Math.max(0.7, 1.9 - elapsed*0.02 - score*0.006);
  if(spawnStarT <= 0){ spawnStar(); spawnStarT = 0.9 + Math.random()*0.8; }
  if(spawnHazT <= 0){ spawnHazard(); spawnHazT = hazInterval + Math.random()*0.7; }

  const move = speed * dt;

  // stars
  for(let i=stars.length-1;i>=0;i--){
    const s = stars[i];
    s.x -= move;
    s.t += dt*4;
    if(!s.got){
      const dx = s.x - hero.x, dy = s.y - hero.y;
      if(dx*dx+dy*dy < (s.r+hero.r)*(s.r+hero.r)){
        s.got = true;
        score += 1;
        updateHUD();
        sfx.star();
        popups.push({x:s.x, y:s.y, life:0.9, max:0.9, txt:'+1'});
        for(let k=0;k<12;k++){
          particles.push({
            x:s.x, y:s.y,
            vx:(Math.random()-0.5)*260, vy:(Math.random()-0.5)*260,
            life:0.6, max:0.6, r:2+Math.random()*3,
            col:'#ffd23f', kind:'burst'
          });
        }
      }
    }
    if(s.x < -50) stars.splice(i,1);
  }

  // hazards
  for(let i=hazards.length-1;i>=0;i--){
    const hz = hazards[i];
    hz.x -= move;
    hz.t += dt*2;
    hz.y = hz.baseY + Math.sin(hz.t)*hz.bob;
    const dx = hz.x - hero.x, dy = hz.y - hero.y;
    const hitR = (hz.r*0.8 + hero.r*0.8);
    if(grace <= 0 && dx*dx+dy*dy < hitR*hitR){ gameOver(); return; }
    if(hz.x < -80) hazards.splice(i,1);
  }

  updateParticles(dt);

  // popups
  for(let i=popups.length-1;i>=0;i--){
    const p = popups[i];
    p.y -= 40*dt; p.x -= move; p.life -= dt;
    if(p.life <= 0) popups.splice(i,1);
  }

  if(shake > 0) shake = Math.max(0, shake - dt*40);
  if(flash > 0) flash = Math.max(0, flash - dt*2.2);
}

function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt;
    if(p.kind==='burst'){ p.vy += 500*dt; }
    p.life -= dt;
    if(p.life <= 0) particles.splice(i,1);
  }
}

/* ---------- Draw ---------- */
function draw(){
  ctx.save();
  // screen shake
  if(shake > 0){
    ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  }

  drawBackground();
  drawStars();
  drawParticlesBehind();
  drawHazards();
  if(state === STATE.PLAY || (state===STATE.OVER)) {
    if(hero.alive) drawHero();
  }
  drawParticlesFront();
  drawPopups();

  ctx.restore();

  // flash overlay (hit)
  if(flash > 0){
    ctx.save();
    ctx.globalAlpha = flash*0.6;
    ctx.fillStyle = '#ff3b6b';
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
}

function drawBackground(){
  // sky gradient
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#5b7cff');
  g.addColorStop(0.45,'#8ab6ff');
  g.addColorStop(1,'#ffd9e8');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  // sun glow
  ctx.save();
  const sun = ctx.createRadialGradient(W*0.8, H*0.22, 10, W*0.8, H*0.22, 220);
  sun.addColorStop(0,'rgba(255,240,180,.9)');
  sun.addColorStop(1,'rgba(255,240,180,0)');
  ctx.fillStyle = sun;
  ctx.fillRect(0,0,W,H);
  ctx.restore();

  // far drifting clouds (slow parallax)
  ctx.save();
  ctx.globalAlpha = 0.55;
  const fSpeed = scroll*0.15;
  for(const c of farClouds){
    let cx = ((c.x*W) - (fSpeed % (W+300)) );
    cx = ((cx % (W+300)) + (W+300)) % (W+300) - 150;
    puffCloud(cx, c.y*H, 40*c.s, '#ffffff');
  }
  ctx.restore();

  // city skyline silhouette (mid parallax)
  ctx.save();
  ctx.fillStyle = 'rgba(70,60,130,.55)';
  const sSpeed = scroll*0.35;
  const period = W + 400;
  for(const b of skyline){
    let bx = b.x - (sSpeed % period);
    bx = ((bx % period)+period)%period - 100;
    ctx.fillRect(bx, H - b.h, b.w, b.h);
    // simple windows
    ctx.fillStyle = 'rgba(255,225,150,.18)';
    for(let wy = H - b.h + 12; wy < H - 10; wy += 22){
      for(let wx = bx+6; wx < bx + b.w - 6; wx += 16){
        if((wx+wy)%3===0) ctx.fillRect(wx, wy, 6, 10);
      }
    }
    ctx.fillStyle = 'rgba(70,60,130,.55)';
  }
  ctx.restore();

  // near foreground rolling hills (fast parallax)
  ctx.save();
  const nSpeed = scroll*0.7;
  ctx.fillStyle = 'rgba(120,80,160,.5)';
  ctx.beginPath();
  ctx.moveTo(0, H);
  const amp = 26, wl = 220;
  for(let x=0; x<=W; x+=10){
    const y = H - 46 - Math.sin((x + nSpeed)/wl)*amp - 20;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function puffCloud(x,y,s,col){
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.arc(x, y, s, 0, 6.283);
  ctx.arc(x+s*0.9, y+s*0.15, s*0.75, 0, 6.283);
  ctx.arc(x-s*0.9, y+s*0.2, s*0.7, 0, 6.283);
  ctx.arc(x+s*0.2, y-s*0.5, s*0.6, 0, 6.283);
  ctx.fill();
}

function drawStars(){
  for(const s of stars){
    if(s.got) continue;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(Math.sin(s.t)*0.25);
    const pulse = 1 + Math.sin(s.t)*0.08;
    // glow
    const gl = ctx.createRadialGradient(0,0,2,0,0,s.r*2.4);
    gl.addColorStop(0,'rgba(255,220,80,.7)');
    gl.addColorStop(1,'rgba(255,220,80,0)');
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(0,0,s.r*2.4,0,6.283); ctx.fill();
    // star shape
    drawStarShape(0,0,s.r*pulse, s.r*0.45*pulse, '#ffd23f','#ff9e2f');
    // sparkle
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    const sp = Math.abs(Math.sin(s.t*1.3))*s.r*0.5;
    ctx.beginPath(); ctx.arc(-s.r*0.3,-s.r*0.3, 2+sp*0.15,0,6.283); ctx.fill();
    ctx.restore();
  }
}
function drawStarShape(cx,cy,R,r,fill,stroke){
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const ang = -Math.PI/2 + i*Math.PI/5;
    const rad = i%2===0 ? R : r;
    const px = cx + Math.cos(ang)*rad;
    const py = cy + Math.sin(ang)*rad;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = stroke; ctx.stroke();
}

function drawHazards(){
  for(const hz of hazards){
    ctx.save();
    ctx.translate(hz.x, hz.y);
    if(hz.kind === 'cloud'){
      // danger glow
      const gl = ctx.createRadialGradient(0,0,6,0,0,hz.r*2.2);
      gl.addColorStop(0,'rgba(90,90,160,.45)');
      gl.addColorStop(1,'rgba(90,90,160,0)');
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(0,0,hz.r*2.2,0,6.283); ctx.fill();
      // storm cloud
      puffCloud(0,0,hz.r*0.85,'#6b6f8f');
      puffCloud(0,-hz.r*0.2,hz.r*0.6,'#565a7a');
      // lightning
      if(Math.sin(hz.t*3)>0.6){
        ctx.strokeStyle='#ffe14d'; ctx.lineWidth=3; ctx.lineJoin='round';
        ctx.beginPath();
        ctx.moveTo(-4,hz.r*0.3); ctx.lineTo(6,hz.r*0.9);
        ctx.lineTo(-2,hz.r*1.0); ctx.lineTo(8,hz.r*1.7);
        ctx.stroke();
      }
    } else {
      // bird
      ctx.rotate(Math.sin(hz.t*2)*0.06);
      const wing = Math.sin(hz.t*7)*hz.r*0.7;
      ctx.fillStyle = '#3a3a55';
      // body
      ctx.beginPath(); ctx.ellipse(0,0,hz.r*0.6,hz.r*0.42,0,0,6.283); ctx.fill();
      // wings
      ctx.beginPath();
      ctx.moveTo(0,0); ctx.quadraticCurveTo(-hz.r*0.9,-wing,-hz.r*1.4,-wing*0.3);
      ctx.quadraticCurveTo(-hz.r*0.8, hz.r*0.1, 0,0);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0,0); ctx.quadraticCurveTo(hz.r*0.9,-wing,hz.r*1.4,-wing*0.3);
      ctx.quadraticCurveTo(hz.r*0.8, hz.r*0.1, 0,0);
      ctx.fill();
      // beak + eye
      ctx.fillStyle='#ffb347';
      ctx.beginPath(); ctx.moveTo(hz.r*0.55,0); ctx.lineTo(hz.r*0.9,-3); ctx.lineTo(hz.r*0.9,3); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(hz.r*0.3,-hz.r*0.1,3,0,6.283); ctx.fill();
      ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(hz.r*0.32,-hz.r*0.1,1.5,0,6.283); ctx.fill();
    }
    ctx.restore();
  }
}

function drawHero(){
  // cape trail behind
  if(cape.length > 2){
    ctx.save();
    const grd = ctx.createLinearGradient(hero.x-40, hero.y, hero.x, hero.y);
    grd.addColorStop(0,'rgba(255,60,120,0)');
    grd.addColorStop(1,'rgba(255,60,120,.85)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.moveTo(cape[0].x, cape[0].y-8);
    for(let i=0;i<cape.length;i++){
      ctx.lineTo(cape[i].x, cape[i].y - 8 + Math.sin(i*0.8+elapsed*6)*3);
    }
    for(let i=cape.length-1;i>=0;i--){
      ctx.lineTo(cape[i].x, cape[i].y + 14 + Math.sin(i*0.8+elapsed*6)*3);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  ctx.save();
  ctx.translate(hero.x, hero.y);
  ctx.rotate(hero.rot);

  // body
  ctx.fillStyle = '#3aa0ff';
  roundRect(-14,-6,28,30,10); ctx.fill();
  // chest emblem
  ctx.fillStyle = '#ffd23f';
  drawStarShape(0,6,7,3,'#ffd23f','#ff9e2f');
  // arms forward (flying pose)
  ctx.fillStyle = '#3aa0ff';
  roundRect(6,-4,24,9,5); ctx.fill();
  // head
  ctx.fillStyle = '#ffd9b0';
  ctx.beginPath(); ctx.arc(6,-14,11,0,6.283); ctx.fill();
  // mask
  ctx.fillStyle = '#7b5cff';
  ctx.beginPath();
  ctx.arc(6,-16,11,Math.PI*1.02,Math.PI*2.05);
  ctx.lineTo(6,-14);
  ctx.fill();
  // eyes
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(9,-14,2.4,0,6.283); ctx.fill();
  // smile
  ctx.strokeStyle='#c47a4a'; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.arc(7,-9,4,0.1,Math.PI-0.2); ctx.stroke();
  // fist glow
  ctx.fillStyle='rgba(255,255,255,.4)';
  ctx.beginPath(); ctx.arc(30,0,6,0,6.283); ctx.fill();

  ctx.restore();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawParticlesBehind(){
  for(const p of particles){
    if(p.kind!=='trail') continue;
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life/p.max);
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
    ctx.restore();
  }
}
function drawParticlesFront(){
  for(const p of particles){
    if(p.kind!=='burst') continue;
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life/p.max);
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
    ctx.restore();
  }
}

function drawPopups(){
  for(const p of popups){
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life/p.max);
    ctx.font = "800 26px 'Baloo 2', sans-serif";
    ctx.textAlign='center';
    ctx.lineWidth = 4; ctx.strokeStyle='#fff';
    ctx.strokeText(p.txt, p.x, p.y);
    ctx.fillStyle = '#ffd23f';
    ctx.fillText(p.txt, p.x, p.y);
    ctx.restore();
  }
}

/* ---------- Loop ---------- */
function frame(t){
  if(!lastT) lastT = t;
  let dt = (t - lastT)/1000;
  lastT = t;
  if(dt > 0.05) dt = 0.05; // clamp big gaps (tab switch)
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

/* ---------- Boot ---------- */
resize();
resetGame();
state = STATE.MENU;
updateHUD();
requestAnimationFrame(frame);

// Minimal debug hook (harmless): lets automated tests inspect/drive the game.
window.__hf = {
  get state(){ return state; },
  get score(){ return score; },
  get hero(){ return hero; },
  get stars(){ return stars; },
  get hazards(){ return hazards; },
  addStar(x,y){ stars.push({x, y, r:15, t:0, got:false}); },
  setGrace(v){ grace = v; }
};

})();
</script>
