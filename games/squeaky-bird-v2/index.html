<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Squeaky Bird v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: 'Fredoka', system-ui, sans-serif;
    background: #6dc5f5; user-select: none; touch-action: none;
  }
  #game { position: fixed; inset: 0; display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

  .pill {
    position: absolute; display: inline-flex; align-items: center; gap: 6px;
    background: rgba(15, 23, 42, 0.55);
    backdrop-filter: blur(6px);
    color: #fff; text-decoration: none;
    padding: 9px 15px; border-radius: 999px;
    font-weight: 600; font-size: 15px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    pointer-events: auto;
  }
  #hubLink { top: 14px; left: 14px; transition: transform .12s ease; }
  #hubLink:active { transform: scale(0.94); }

  #vBadge {
    top: 14px; right: 14px;
    background: linear-gradient(135deg, #ff8a3d, #ff5f9e);
    font-weight: 700; letter-spacing: .5px;
    padding: 8px 14px; font-size: 14px;
  }

  #muteBtn {
    top: 62px; right: 14px;
    background: rgba(15, 23, 42, 0.55);
    font-size: 18px; padding: 8px 12px; cursor: pointer; border: none;
  }
  #muteBtn:active { transform: scale(0.94); }

  #hud {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    text-align: center; color: #fff; pointer-events: none;
    text-shadow: 0 3px 0 rgba(0,0,0,0.18), 0 6px 12px rgba(0,0,0,0.25);
  }
  #scoreBig { font-size: 64px; font-weight: 700; line-height: 1; }
  #hiSmall { font-size: 16px; font-weight: 600; margin-top: 4px; opacity: .95; }
  #hiSmall .k { opacity: .8; }

  .card {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: min(88vw, 340px);
    background: #fff;
    border: 6px solid #ffcf3d;
    border-radius: 28px;
    padding: 26px 24px 28px;
    text-align: center;
    box-shadow: 0 18px 45px rgba(0,0,0,0.28);
    pointer-events: auto;
  }
  .card h1 { font-size: 34px; color: #2b3a67; font-weight: 700; margin-bottom: 4px; }
  .card .sub { font-size: 15px; color: #6b7793; font-weight: 500; margin-bottom: 18px; }
  .bigEmoji { font-size: 52px; line-height: 1; margin-bottom: 6px; }

  .btn {
    display: inline-block; border: none; cursor: pointer;
    font-family: inherit; font-weight: 700; font-size: 22px; color: #fff;
    background: linear-gradient(135deg, #38d17a, #16a95d);
    padding: 14px 34px; border-radius: 999px;
    box-shadow: 0 8px 0 #0d7a41, 0 12px 18px rgba(0,0,0,0.2);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 3px 0 #0d7a41, 0 5px 10px rgba(0,0,0,0.2); }

  .goRow {
    display: flex; justify-content: space-around; align-items: stretch;
    background: #f2f5fb; border-radius: 18px; padding: 12px 8px; margin: 6px 0 18px;
  }
  .goRow .lbl { font-size: 13px; color: #8791a8; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
  .goRow .val { font-size: 32px; color: #2b3a67; font-weight: 700; }
  .medal { font-size: 40px; margin: 2px 0 10px; }
  .medalTxt { font-size: 15px; color: #6b7793; font-weight: 600; margin-bottom: 4px; }

  .hide { display: none !important; }
  .pop { animation: pop .3s cubic-bezier(.2,1.4,.5,1) both; }
  @keyframes pop { from { transform: translate(-50%,-50%) scale(.7); opacity: 0; } to { transform: translate(-50%,-50%) scale(1); opacity: 1; } }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui">
    <a id="hubLink" class="pill" href="../../index.html">← Hub</a>
    <span id="vBadge" class="pill">v2</span>
    <button id="muteBtn" class="pill" title="Mute">🔊</button>

    <div id="hud" class="hide">
      <div id="scoreBig">0</div>
      <div id="hiSmall"><span class="k">BEST</span> <span id="hiVal">0</span></div>
    </div>

    <div id="startCard" class="card pop">
      <div class="bigEmoji">🐤</div>
      <h1>Squeaky Bird</h1>
      <div class="sub">Tap or press SPACE to flap. Fly through the pipes!</div>
      <button id="startBtn" class="btn">▶ Play</button>
    </div>

    <div id="overCard" class="card hide">
      <h1>Game Over</h1>
      <div class="medal" id="medalEmoji">🥉</div>
      <div class="medalTxt" id="medalTxt">Nice try!</div>
      <div class="goRow">
        <div><div class="lbl">Score</div><div class="val" id="finalScore">0</div></div>
        <div><div class="lbl">Best</div><div class="val" id="finalBest">0</div></div>
      </div>
      <button id="againBtn" class="btn">▶ Play again</button>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");

  // ---------- UI refs ----------
  var hud = document.getElementById("hud");
  var scoreBig = document.getElementById("scoreBig");
  var hiVal = document.getElementById("hiVal");
  var startCard = document.getElementById("startCard");
  var overCard = document.getElementById("overCard");
  var startBtn = document.getElementById("startBtn");
  var againBtn = document.getElementById("againBtn");
  var muteBtn = document.getElementById("muteBtn");
  var finalScore = document.getElementById("finalScore");
  var finalBest = document.getElementById("finalBest");
  var medalEmoji = document.getElementById("medalEmoji");
  var medalTxt = document.getElementById("medalTxt");

  // ---------- Sizing ----------
  var W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.max(1, Math.floor(W * DPR));
    canvas.height = Math.max(1, Math.floor(H * DPR));
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    groundY = H - Math.max(70, H * 0.12);
    if (state === "menu") { placeBirdStart(); buildClouds(); }
  }
  window.addEventListener("resize", resize);

  // ---------- Audio ----------
  var AC = null, muted = false;
  try { muted = localStorage.getItem("sqb2_muted") === "1"; } catch (e) {}
  muteBtn.textContent = muted ? "🔇" : "🔊";
  function audio() {
    if (muted) return null;
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (AC.state === "suspended") AC.resume();
    return AC;
  }
  function beep(freq, dur, type, vol) {
    var a = audio(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || "square"; o.frequency.value = freq;
    g.gain.value = 0.0001;
    o.connect(g); g.connect(a.destination);
    var t = a.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function sFlap() { beep(520, 0.12, "sine", 0.16); beep(760, 0.08, "triangle", 0.08); }
  function sScore() { beep(880, 0.09, "square", 0.12); setTimeout(function(){ beep(1180, 0.1, "square", 0.12); }, 70); }
  function sHit() {
    var a = audio(); if (!a) return;
    beep(200, 0.18, "sawtooth", 0.2);
    setTimeout(function(){ beep(120, 0.25, "sawtooth", 0.18); }, 80);
  }
  muteBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    muted = !muted;
    muteBtn.textContent = muted ? "🔇" : "🔊";
    try { localStorage.setItem("sqb2_muted", muted ? "1" : "0"); } catch (err) {}
  });

  // ---------- State ----------
  var state = "menu"; // menu | play | dead
  var groundY = 0;
  var score = 0, best = 0;
  try { best = parseInt(localStorage.getItem("sqb2_best") || "0", 10) || 0; } catch (e) {}
  hiVal.textContent = best;

  // Bird
  var bird = { x: 0, y: 0, r: 18, vy: 0, angle: 0, wing: 0 };
  var GRAVITY = 1500;      // px/s^2
  var FLAP_V = -430;       // px/s
  var groundScroll = 0;

  // Pipes
  var pipes = [];
  var pipeW = 74;
  var pipeSpeed = 170;     // px/s
  var spawnEvery = 1.5;    // seconds
  var spawnTimer = 0;
  var baseGap = 190;

  // Parallax
  var clouds = [];
  var bgFar = 0, bgNear = 0;

  // FX
  var particles = [];
  var shake = 0;
  var flash = 0;

  function placeBirdStart() {
    bird.x = W * 0.30;
    bird.y = H * 0.45;
    bird.vy = 0; bird.angle = 0; bird.wing = 0;
    bird.r = Math.max(14, Math.min(22, H * 0.026));
  }

  function buildClouds() {
    clouds = [];
    var n = 5;
    for (var i = 0; i < n; i++) {
      clouds.push({
        x: Math.random() * W,
        y: (H * 0.08) + Math.random() * (H * 0.35),
        s: 0.5 + Math.random() * 0.9,
        sp: 12 + Math.random() * 18
      });
    }
  }

  function reset() {
    score = 0;
    scoreBig.textContent = "0";
    pipes = [];
    particles = [];
    spawnTimer = 0.4;
    shake = 0; flash = 0;
    placeBirdStart();
    groundScroll = 0;
  }

  function currentGap() {
    // gap narrows slowly with score, clamped
    var g = baseGap - score * 3.5;
    var minGap = Math.max(120, bird.r * 6.2);
    return Math.max(minGap, g);
  }

  function spawnPipe() {
    var gap = currentGap();
    var margin = 60;
    var minTop = margin;
    var maxTop = groundY - gap - margin;
    if (maxTop < minTop) maxTop = minTop;
    var topH = minTop + Math.random() * (maxTop - minTop);
    pipes.push({ x: W + pipeW, top: topH, gap: gap, passed: false });
  }

  function flap() {
    if (state === "play") {
      bird.vy = FLAP_V;
      bird.wing = 1;
      sFlap();
      // feather / sparkle burst
      for (var i = 0; i < 7; i++) {
        particles.push({
          x: bird.x - bird.r, y: bird.y,
          vx: -80 - Math.random() * 120, vy: (Math.random() - 0.5) * 160 - 20,
          life: 0.5 + Math.random() * 0.3, age: 0,
          r: 2 + Math.random() * 3,
          col: Math.random() < 0.5 ? "#fff7d6" : "#ffe680", kind: "feather"
        });
      }
    }
  }

  function scorePuff(px, py) {
    for (var i = 0; i < 12; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 40 + Math.random() * 120;
      particles.push({
        x: px, y: py,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 20,
        life: 0.4 + Math.random() * 0.3, age: 0,
        r: 2 + Math.random() * 3,
        col: ["#8ef0c0","#fff","#9ad8ff"][Math.floor(Math.random()*3)], kind: "star"
      });
    }
  }

  function die() {
    if (state !== "play") return;
    state = "dead";
    sHit();
    shake = 16;
    flash = 1;
    for (var i = 0; i < 18; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 60 + Math.random() * 180;
      particles.push({
        x: bird.x, y: bird.y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.6 + Math.random() * 0.4, age: 0,
        r: 2 + Math.random() * 3, col: "#ffd54a", kind: "feather"
      });
    }
    if (score > best) {
      best = score;
      try { localStorage.setItem("sqb2_best", String(best)); } catch (e) {}
    }
    hiVal.textContent = best;
    // medal
    var m = "🥉", mt = "Good start!";
    if (score >= 30) { m = "🥇"; mt = "Legendary flyer!"; }
    else if (score >= 15) { m = "🥈"; mt = "Great flying!"; }
    else if (score >= 5) { m = "🥉"; mt = "Nice job!"; }
    else { m = "🐣"; mt = "Keep trying!"; }
    medalEmoji.textContent = m;
    medalTxt.textContent = mt;
    finalScore.textContent = score;
    finalBest.textContent = best;
    setTimeout(function () {
      hud.classList.add("hide");
      overCard.classList.remove("hide");
      overCard.classList.remove("pop"); void overCard.offsetWidth; overCard.classList.add("pop");
    }, 650);
  }

  function startGame() {
    reset();
    state = "play";
    startCard.classList.add("hide");
    overCard.classList.add("hide");
    hud.classList.remove("hide");
    audio(); // unlock on gesture
  }

  // ---------- Input ----------
  function press(e) {
    if (state === "play") { flap(); }
  }
  window.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.code === "ArrowUp") {
      e.preventDefault();
      if (state === "menu") startGame();
      else if (state === "play") flap();
      else if (state === "dead" && overCard.classList.contains("hide") === false) startGame();
    }
  });
  // Canvas taps (pointer) — cards have their own buttons
  canvas.addEventListener("pointerdown", function (e) {
    if (state === "play") flap();
  });
  startBtn.addEventListener("click", function (e) { e.stopPropagation(); startGame(); });
  againBtn.addEventListener("click", function (e) { e.stopPropagation(); startGame(); });

  // ---------- Update ----------
  function update(dt) {
    // parallax always moves (nice on menu too)
    bgFar -= 8 * dt;
    bgNear -= 22 * dt;
    for (var i = 0; i < clouds.length; i++) {
      var c = clouds[i];
      c.x -= c.sp * dt;
      if (c.x < -120) { c.x = W + 60; c.y = (H * 0.08) + Math.random() * (H * 0.35); }
    }

    if (state === "play") {
      groundScroll = (groundScroll + pipeSpeed * dt) % 40;
    }

    if (state === "play") {
      bird.vy += GRAVITY * dt;
      bird.y += bird.vy * dt;
      // angle: up when rising, nose down when falling
      var target = Math.max(-0.5, Math.min(1.2, bird.vy / 620));
      bird.angle += (target - bird.angle) * Math.min(1, dt * 10);

      // spawn
      spawnTimer -= dt;
      if (spawnTimer <= 0) { spawnPipe(); spawnTimer = spawnEvery; }

      // move pipes
      for (var p = pipes.length - 1; p >= 0; p--) {
        var pi = pipes[p];
        pi.x -= pipeSpeed * dt;
        if (!pi.passed && pi.x + pipeW < bird.x - bird.r) {
          pi.passed = true;
          score++;
          scoreBig.textContent = score;
          sScore();
          scorePuff(bird.x + bird.r, bird.y);
        }
        if (pi.x + pipeW < -20) pipes.splice(p, 1);
      }

      // collisions
      if (bird.y + bird.r >= groundY) { bird.y = groundY - bird.r; die(); }
      if (bird.y - bird.r <= 0) { bird.y = bird.r; bird.vy = 0; }
      for (var q = 0; q < pipes.length; q++) {
        if (hitsPipe(pipes[q])) { die(); break; }
      }
    } else if (state === "dead") {
      // let bird fall to ground for effect
      if (bird.y + bird.r < groundY) {
        bird.vy += GRAVITY * dt;
        bird.y += bird.vy * dt;
        bird.angle = Math.min(1.4, bird.angle + dt * 3);
      } else { bird.y = groundY - bird.r; }
    } else {
      // menu bob
      bird.y = H * 0.45 + Math.sin(performance.now() / 400) * 12;
      bird.angle = Math.sin(performance.now() / 400) * 0.12;
    }

    // wing animation decay
    bird.wing *= Math.pow(0.001, dt);

    // particles
    for (var k = particles.length - 1; k >= 0; k--) {
      var pt = particles[k];
      pt.age += dt;
      if (pt.age >= pt.life) { particles.splice(k, 1); continue; }
      pt.vy += 260 * dt;
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
    }

    if (shake > 0) shake = Math.max(0, shake - dt * 40);
    if (flash > 0) flash = Math.max(0, flash - dt * 2.2);
  }

  function hitsPipe(pi) {
    var bx = bird.x, by = bird.y, r = bird.r * 0.86;
    if (bx + r < pi.x || bx - r > pi.x + pipeW) return false;
    var gapTop = pi.top, gapBot = pi.top + pi.gap;
    if (by - r < gapTop || by + r > gapBot) return true;
    return false;
  }

  // ---------- Render ----------
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBackground() {
    // sky gradient
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#6fc9f7");
    g.addColorStop(0.55, "#9fe0f5");
    g.addColorStop(1, "#d9f6ef");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // sun glow
    ctx.save();
    var sun = ctx.createRadialGradient(W * 0.82, H * 0.2, 10, W * 0.82, H * 0.2, 160);
    sun.addColorStop(0, "rgba(255,247,210,0.9)");
    sun.addColorStop(1, "rgba(255,247,210,0)");
    ctx.fillStyle = sun;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    // far mountains
    drawHills(H - groundY === 0 ? H : groundY, "#bfe6c9", 90, bgFar, 0.55);
    // distant city silhouette
    drawCity(groundY, bgNear);
    // near hills
    drawHills(groundY, "#a6dcb0", 60, bgNear * 0.6, 0.9);

    // clouds
    for (var i = 0; i < clouds.length; i++) drawCloud(clouds[i]);
  }

  function drawHills(baseY, col, amp, off, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(0, baseY);
    var step = 60;
    for (var x = 0; x <= W + step; x += step) {
      var y = baseY - amp * (0.5 + 0.5 * Math.sin((x + off) / 180));
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, baseY); ctx.lineTo(0, baseY);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawCity(baseY, off) {
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = "#7fb8d6";
    var bw = 46, gap = 14;
    var startX = ((off % (bw + gap)) + (bw + gap)) % (bw + gap) - (bw + gap);
    var seed = 1;
    for (var x = startX, i = 0; x < W + bw; x += bw + gap, i++) {
      // deterministic pseudo-random height
      var idx = Math.floor((x - off) / (bw + gap));
      var h = 60 + (Math.abs(Math.sin(idx * 12.9898) * 43758.5453) % 1) * 130;
      ctx.fillRect(x, baseY - h, bw, h);
    }
    ctx.restore();
  }

  function drawCloud(c) {
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = "#ffffff";
    var s = c.s;
    ctx.beginPath();
    ctx.arc(c.x, c.y, 22 * s, 0, Math.PI * 2);
    ctx.arc(c.x + 24 * s, c.y + 6 * s, 18 * s, 0, Math.PI * 2);
    ctx.arc(c.x - 24 * s, c.y + 6 * s, 16 * s, 0, Math.PI * 2);
    ctx.arc(c.x + 4 * s, c.y - 10 * s, 16 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawPipe(pi) {
    var capH = 26, capOver = 6;
    var gapTop = pi.top, gapBot = pi.top + pi.gap;

    function body(x, y, w, h) {
      var g = ctx.createLinearGradient(x, 0, x + w, 0);
      g.addColorStop(0, "#5bbf3a");
      g.addColorStop(0.35, "#82e05a");
      g.addColorStop(0.5, "#a6ef7c");
      g.addColorStop(0.65, "#82e05a");
      g.addColorStop(1, "#3f9c28");
      ctx.fillStyle = g;
      roundRect(x, y, w, h, 8); ctx.fill();
      ctx.strokeStyle = "rgba(30,90,20,0.35)";
      ctx.lineWidth = 2;
      roundRect(x, y, w, h, 8); ctx.stroke();
    }
    function cap(x, y) {
      var g = ctx.createLinearGradient(x, 0, x + pipeW + capOver * 2, 0);
      g.addColorStop(0, "#4fae30");
      g.addColorStop(0.5, "#9dea72");
      g.addColorStop(1, "#398f22");
      ctx.fillStyle = g;
      roundRect(x - capOver, y, pipeW + capOver * 2, capH, 10); ctx.fill();
      ctx.strokeStyle = "rgba(30,90,20,0.35)";
      ctx.lineWidth = 2;
      roundRect(x - capOver, y, pipeW + capOver * 2, capH, 10); ctx.stroke();
    }
    // top pipe (hangs down)
    body(pi.x, -20, pipeW, gapTop + 20);
    cap(pi.x, gapTop - capH);
    // bottom pipe
    body(pi.x, gapBot, pipeW, groundY - gapBot + 20);
    cap(pi.x, gapBot);
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.angle);
    var r = bird.r;

    // shadow
    ctx.save();
    ctx.globalAlpha = 0.15;
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.ellipse(2, r + 3, r * 0.9, r * 0.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // body
    var g = ctx.createRadialGradient(-r*0.3, -r*0.3, r*0.2, 0, 0, r*1.2);
    g.addColorStop(0, "#fff3a0");
    g.addColorStop(1, "#ffcf33");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#e0a600"; ctx.lineWidth = 2; ctx.stroke();

    // belly
    ctx.fillStyle = "#fff6cf";
    ctx.beginPath(); ctx.ellipse(-r*0.1, r*0.35, r*0.6, r*0.45, 0, 0, Math.PI * 2); ctx.fill();

    // wing (animated flap)
    var flap = bird.wing; // 0..1
    var wingAng = -0.6 + flap * 1.4;
    ctx.save();
    ctx.translate(-r * 0.15, -r * 0.1);
    ctx.rotate(wingAng);
    ctx.fillStyle = "#ffb733";
    ctx.strokeStyle = "#e0a600"; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(-r * 0.4, 0, r * 0.7, r * 0.42, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.restore();

    // eye
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(r * 0.35, -r * 0.35, r * 0.32, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#222";
    ctx.beginPath(); ctx.arc(r * 0.44, -r * 0.35, r * 0.16, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(r * 0.5, -r * 0.42, r * 0.06, 0, Math.PI * 2); ctx.fill();

    // beak
    ctx.fillStyle = "#ff8a2b";
    ctx.strokeStyle = "#e56f13"; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(r * 0.7, -r * 0.06);
    ctx.lineTo(r * 1.25, r * 0.1);
    ctx.lineTo(r * 0.7, r * 0.28);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    ctx.restore();
  }

  function drawGround() {
    var gh = H - groundY;
    // dirt
    var g = ctx.createLinearGradient(0, groundY, 0, H);
    g.addColorStop(0, "#e6c56a");
    g.addColorStop(1, "#c9a24d");
    ctx.fillStyle = g;
    ctx.fillRect(0, groundY, W, gh);
    // grass top strip
    ctx.fillStyle = "#7ec850";
    ctx.fillRect(0, groundY, W, 14);
    ctx.fillStyle = "#5faa38";
    // moving grass ticks
    var off = -groundScroll;
    for (var x = off; x < W; x += 40) {
      ctx.fillRect(x, groundY + 10, 20, 5);
    }
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var a = 1 - p.age / p.life;
      ctx.save();
      ctx.globalAlpha = Math.max(0, a);
      ctx.fillStyle = p.col;
      if (p.kind === "star") {
        ctx.translate(p.x, p.y);
        ctx.rotate(p.age * 8);
        ctx.fillRect(-p.r, -p.r * 0.35, p.r * 2, p.r * 0.7);
        ctx.fillRect(-p.r * 0.35, -p.r, p.r * 0.7, p.r * 2);
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);

    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    drawBackground();
    for (var i = 0; i < pipes.length; i++) drawPipe(pipes[i]);
    drawGround();
    drawParticles();
    drawBird();

    ctx.restore();

    // collision flash overlay
    if (flash > 0) {
      ctx.fillStyle = "rgba(255,255,255," + (flash * 0.7) + ")";
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ---------- Loop ----------
  var last = performance.now();
  function loop(now) {
    var dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05; // clamp for tab switches
    if (dt < 0) dt = 0;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  // ---------- Debug bridge (harmless; used only by automated tests) ----------
  window.__sqb = {
    get state() { return state; },
    get score() { return score; },
    get bird() { return bird; },
    get pipes() { return pipes; },
    get groundY() { return groundY; }
  };

  // ---------- Boot ----------
  resize();
  placeBirdStart();
  buildClouds();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
