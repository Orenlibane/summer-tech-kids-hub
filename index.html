<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>🎮 Summer Tech · Kids Games Hub</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A colorful arcade for the Summer Tech kids camp — play games, meet the sprites, and learn to build!">
<meta name="theme-color" content="#6C4CF1">
<meta property="og:type" content="website">
<meta property="og:title" content="Summer Tech · Kids Games Hub">
<meta property="og:description" content="A colorful arcade for the Summer Tech kids camp — play games and meet the sprites!">
<meta property="og:image" content="games/mad-bunnies/og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --p1:#6C4CF1; --p2:#FF5DA2; --p3:#3BE1C5; --p4:#FFD23F; --p5:#FF8A3D;
    --ink:#25123f; --card:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Fredoka',system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(135deg,#7b5cff,#ff6ec7 45%,#ffd23f 100%);
    background-attachment:fixed;
    min-height:100vh;
    overflow-x:hidden;
  }
  /* floating blobs */
  .blob{position:fixed;border-radius:50%;filter:blur(6px);opacity:.35;z-index:0;animation:float 9s ease-in-out infinite}
  .b1{width:200px;height:200px;background:#3BE1C5;top:10%;left:-40px}
  .b2{width:280px;height:280px;background:#FFD23F;top:55%;right:-60px;animation-delay:-3s}
  .b3{width:160px;height:160px;background:#FF5DA2;bottom:5%;left:10%;animation-delay:-6s}
  @keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-30px) scale(1.08)}}

  header{position:relative;z-index:2;text-align:center;padding:56px 20px 20px}
  .badge{display:inline-block;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.6);
    backdrop-filter:blur(6px);color:#fff;font-weight:700;padding:8px 20px;border-radius:999px;
    letter-spacing:.5px;font-size:15px;margin-bottom:18px;text-transform:uppercase}
  h1{font-family:'Baloo 2',cursive;font-weight:800;color:#fff;font-size:clamp(38px,7vw,74px);
    margin:0;line-height:1.02;text-shadow:0 6px 0 rgba(108,76,241,.45),0 14px 30px rgba(0,0,0,.25)}
  h1 .wave{display:inline-block;animation:wave 2.2s ease-in-out infinite;transform-origin:70% 70%}
  @keyframes wave{0%,60%,100%{transform:rotate(0)}10%{transform:rotate(16deg)}20%{transform:rotate(-8deg)}30%{transform:rotate(16deg)}40%{transform:rotate(-4deg)}50%{transform:rotate(10deg)}}
  .sub{color:#fff;font-size:clamp(16px,2.4vw,21px);max-width:640px;margin:16px auto 0;opacity:.95;font-weight:500}

  .toolbar{position:relative;z-index:2;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:26px auto 0}
  .pill{cursor:pointer;border:none;font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;
    padding:12px 22px;border-radius:999px;background:rgba(255,255,255,.9);color:var(--ink);
    box-shadow:0 6px 0 rgba(0,0,0,.15);transition:transform .12s,box-shadow .12s}
  .pill:hover{transform:translateY(-2px)}
  .pill:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
  .pill.on{background:var(--p1);color:#fff}
  .pill.gallery{background:linear-gradient(90deg,var(--p3),var(--p4));color:var(--ink)}

  main{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:36px 20px 80px}

  .zone{margin:44px 0 8px}
  .zone-head{display:flex;align-items:center;gap:14px;color:#fff;margin:0 4px 18px}
  .zone-emoji{font-size:40px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
  .zone-title{font-family:'Baloo 2',cursive;font-weight:800;font-size:clamp(24px,4vw,34px);margin:0;text-shadow:0 4px 0 rgba(0,0,0,.18)}
  .zone-count{margin-left:auto;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.5);
    color:#fff;font-weight:700;border-radius:999px;padding:4px 14px;font-size:14px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}
  .card{position:relative;display:block;text-decoration:none;color:var(--ink);background:var(--card);
    border-radius:22px;overflow:hidden;box-shadow:0 12px 26px rgba(60,20,90,.28);
    transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s;transform-style:preserve-3d}
  .card:hover{transform:translateY(-10px) rotate(-1deg) scale(1.02);box-shadow:0 22px 40px rgba(60,20,90,.4)}
  .thumb{position:relative;aspect-ratio:16/10;overflow:hidden;background:#eee}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
  .card:hover .thumb img{transform:scale(1.08)}
  .tag{position:absolute;top:12px;left:12px;background:rgba(37,18,63,.82);color:#fff;font-weight:600;
    font-size:12px;padding:5px 11px;border-radius:999px;backdrop-filter:blur(3px)}
  .play{position:absolute;bottom:12px;right:12px;width:46px;height:46px;border-radius:50%;
    background:var(--p2);color:#fff;display:grid;place-items:center;font-size:20px;
    box-shadow:0 6px 14px rgba(0,0,0,.3);transition:transform .18s}
  .card:hover .play{transform:scale(1.15) rotate(8deg)}
  .body{padding:15px 17px 18px}
  .body h3{margin:0;font-family:'Baloo 2',cursive;font-weight:700;font-size:20px;line-height:1.15}
  .body p{margin:7px 0 0;font-size:14px;color:#5a4a72;line-height:1.35}

  /* mini build-it-lab cards */
  .mcard{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 12px 26px rgba(60,20,90,.28);
    display:flex;flex-direction:column;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
  .mcard:hover{transform:translateY(-8px) rotate(-1deg)}
  .mcover{aspect-ratio:16/9;display:grid;place-items:center;font-size:64px;text-decoration:none;position:relative}
  .mcover .go{position:absolute;bottom:10px;right:12px;background:rgba(0,0,0,.35);color:#fff;font-size:13px;
    font-weight:600;padding:5px 12px;border-radius:999px}
  .mbody{padding:14px 16px 16px}
  .mbody h3{margin:0;font-family:'Baloo 2',cursive;font-weight:700;font-size:19px}
  .mbody .en{margin:5px 0 0;font-size:13px;color:#5a4a72}
  .prompt{margin-top:12px;background:#f4efff;border:2px dashed #b79bff;border-radius:14px;padding:10px 12px;direction:rtl;text-align:right}
  .prompt .lab{font-size:12px;font-weight:700;color:#6C4CF1;margin-bottom:3px}
  .prompt .he{font-size:14px;color:#3a2a5c;line-height:1.4;font-family:'Fredoka','Baloo 2',sans-serif}
  .prompt .copy{margin-top:8px;border:none;background:#6C4CF1;color:#fff;font-family:'Fredoka';font-weight:600;
    font-size:12px;padding:6px 14px;border-radius:999px;cursor:pointer;float:left}
  .prompt .copy:active{transform:scale(.94)}
  /* version tabs inside a family card */
  .mcard.fam{padding-top:2px}
  .fam-title{display:flex;align-items:center;gap:8px;font-family:'Baloo 2',cursive;font-weight:800;
    font-size:19px;padding:14px 16px 8px;color:#25123f}
  .fam-count{margin-left:auto;font-family:'Fredoka';font-weight:600;font-size:11px;color:#9a86bd;
    background:#f1ecfb;padding:3px 9px;border-radius:999px}
  .vtabs{display:flex;gap:6px;padding:0 14px 10px;flex-wrap:wrap}
  .vtab{cursor:pointer;border:none;font-family:'Fredoka';font-weight:600;font-size:13px;
    padding:6px 14px;border-radius:999px;background:#efeaf9;color:#6a5a86;transition:transform .1s}
  .vtab:active{transform:scale(.94)}
  .vtab.on{background:#6C4CF1;color:#fff;box-shadow:0 3px 0 #4a2fc0}
  /* cover image inside a Play tab panel */
  .cover-img{padding:0;overflow:hidden}
  .cover-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
  .cover-img:hover img{transform:scale(1.06)}
  .cover-img .tag{position:absolute;top:10px;left:10px;background:rgba(37,18,63,.82);color:#fff;
    font-weight:600;font-size:12px;padding:5px 11px;border-radius:999px}
  /* sprite thumbnail grid inside a Sprites tab panel */
  .sp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:8px;padding:12px}
  .sp-thumb{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;cursor:pointer;
    background-image:linear-gradient(45deg,#eee 25%,transparent 25%),linear-gradient(-45deg,#eee 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#eee 75%),linear-gradient(-45deg,transparent 75%,#eee 75%);
    background-size:12px 12px;background-position:0 0,0 6px,6px -6px,-6px 0;
    box-shadow:inset 0 0 0 2px #efeaf9;transition:transform .14s cubic-bezier(.34,1.56,.64,1)}
  .sp-thumb:hover{transform:scale(1.12) rotate(-3deg);box-shadow:inset 0 0 0 2px #b79bff}
  .sp-thumb img{max-width:84%;max-height:84%;image-rendering:pixelated;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
  .sp-thumb .em{font-size:30px;line-height:1}
  .sp-hint{font-size:11px;color:#9a86bd;text-align:center;padding:0 12px 12px;font-weight:500}
  /* shared lightbox popup */
  #lb{position:fixed;inset:0;z-index:60;background:rgba(20,6,35,.82);backdrop-filter:blur(4px);
    display:none;place-items:center;padding:20px}
  #lb.on{display:grid}
  #lb .inner{background:#fff;border-radius:24px;padding:24px 26px;max-width:360px;text-align:center;
    box-shadow:0 30px 60px rgba(0,0,0,.5);animation:pop .22s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  #lb .stage{min-height:200px;display:grid;place-items:center;margin-bottom:12px;
    background-image:linear-gradient(45deg,#f0f0f0 25%,transparent 25%),linear-gradient(-45deg,#f0f0f0 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#f0f0f0 75%),linear-gradient(-45deg,transparent 75%,#f0f0f0 75%);
    background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;border-radius:14px}
  #lb .stage img{max-height:220px;max-width:100%;image-rendering:pixelated;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
  #lb .stage .em{font-size:120px;line-height:1}
  #lb h3{font-family:'Baloo 2',cursive;margin:0 0 12px;font-size:22px;color:#25123f}
  #lb .x{border:none;background:#6C4CF1;color:#fff;font-family:'Fredoka';font-weight:600;font-size:16px;
    padding:10px 26px;border-radius:999px;cursor:pointer}

  footer{position:relative;z-index:2;text-align:center;color:#fff;padding:10px 20px 50px;font-weight:500;opacity:.9}
  footer b{font-weight:700}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<header>
  <span class="badge">☀️ Summer Tech Camp · Kids</span>
  <h1>Kids Games <span class="wave">🎮</span> Hub</h1>
  <p class="sub">A colorful arcade built by kids, for kids. Pick a zone, jump into a game, or meet all the pixel heroes in the Sprite Gallery!</p>
  <div class="toolbar" id="filters">
    <button class="pill on" data-filter="all">🌈 All Games</button>
    <button class="pill" data-filter="beatemup">⚔️ Beat 'em Up</button>
    <button class="pill" data-filter="sports">🏆 Sports</button>
    <button class="pill" data-filter="arcade">🚀 Arcade</button>
    <button class="pill" data-filter="build">🛠️ Build-It Lab</button>
    <a class="pill gallery" href="gallery.html">✨ Sprite Gallery</a>
  </div>
</header>

<main id="app"><!-- zones injected by JS --></main>

<footer>Made with 💜 at <b>Summer Tech Camp</b> · Powered by pixel art &amp; imagination</footer>

<div id="lb"><div class="inner">
  <div class="stage" id="lb-stage"></div>
  <h3 id="lb-name"></h3>
  <button class="x" onclick="closeLB()">Close ✨</button>
</div></div>

<script>
const GAMES = [
  {id:"mad-bunnies", title:"Mad Bunnies vs Cute Cats", cat:"beatemup", tag:"⚔️ Beat 'em Up",
   desc:"Three bunny warriors storm the kingdom of the Cute Cats!"},
  {id:"bananas-avocados", title:"Bananas vs Avocados", cat:"beatemup", tag:"⚔️ Food Fight",

   desc:"Sushi ninjas raid the demon night-kitchen across 3 stages."},
  {id:"beast-knights", title:"Beast Knights", cat:"beatemup", tag:"⚔️ Transform",

  {id:"kids-vs-tvs", title:"Kids vs The Screens", cat:"beatemup", tag:"⚔️ Arcade Brawl",

  {id:"hoops-vs-cleats", title:"Hoops vs Cleats", cat:"sports", tag:"🏆 Sports",
   desc:"Basketball stars face off against soccer legends. Who wins?"},
  {id:"ball-race", title:"Ball Race · מירוץ הכדורים", cat:"sports", tag:"🏆 Racing",
   desc:"Race colorful balls to the finish line and level up!"},
  {id:"nebula-strike", title:"Nebula Strike", cat:"arcade", tag:"🚀 Space Shooter",
   desc:"Blast through waves of alien drones and face the nebula boss."},

const ZONES = [
  {cat:"beatemup", emoji:"⚔️", title:"Beat 'em Up Arena"},
  {cat:"sports",   emoji:"🏆", title:"Sports Zone"},
  {cat:"arcade",   emoji:"🚀", title:"Space Arcade"},
];
// Build-It Lab — each GAME is one card; its versions live behind tabs (v1 / v2 / Maki).
// Every version shows its own simple Hebrew "build prompt" so kids can recreate it.
const FAMILIES = [
  {key:"mario", name:"Mario Jump", emoji:"🍄", versions:[
    {id:"mario-jump", label:"v1", emoji:"🍄", grad:["#5c94fc","#43b047"],
     en:"Run & jump over pipes and goombas!",
     he:"תבנה לי משחק שבו דמות חמודה רצה, ובלחיצה על מקש הרווח היא קופצת מעל צינורות ומפלצות — כל מכשול שעוברים מוסיף נקודה."},
    {id:"mario-maki", label:"🍣 Maki", emoji:"🍣", grad:["#ffb36b","#d64545"],
     en:"Same game — now starring Maki the sushi ninja!",
     he:"קח את משחק הקפיצות ותחליף את הדמות הרצה בספרייט של מאקי מ-Sushi Ninjas, עם אנימציית ריצה אמיתית של כמה תמונות שמתחלפות."},
    {id:"mario-jump-v2", label:"v2 ✨", emoji:"🍄", grad:["#4aa3ff","#2ec77a"],
     en:"Parallax, coins, particles, sound & high-scores!",
     he:"קח את משחק הקפיצות ושדרג אותו שיֵראה ויֵרגיש הרבה יותר טוב: רקע רב-שכבתי (פרלקסה), אפקטי חלקיקים בקפיצה ובנחיתה, מטבעות לאיסוף, קפיצה כפולה, רעידת מסך, צלילים ושמירת שיא."},
  ]},
  {key:"bird", name:"Squeaky Bird", emoji:"🐤", versions:[
    {id:"squeaky-bird", label:"v1", emoji:"🐤", grad:["#71c5cf","#f5a623"],
     en:"Tap to flap through the pipe gaps.",
     he:"תבנה משחק של ציפור קטנה שעפה למעלה כשנוגעים במסך, וצריך לעבור בין הצינורות בלי להתנגש בהם."},
    {id:"squeaky-bird-v2", label:"v2 ✨", emoji:"🐤", grad:["#5ec8d6","#ffb648"],
     en:"Flapping wings, feathers, medals & city parallax.",
     he:"שדרג את משחק הציפור: כנפיים שמתנופפות באמת, רקע עיר בפרלקסה, נוצות שמתעופפות בכל נפנוף, פלאש ורעידה בפגיעה, מדליות לפי ניקוד, צלילים ושיא נשמר."},
  ]},
  {key:"hero", name:"Super Hero Fly", emoji:"🦸", versions:[
    {id:"hero-fly", label:"v1", emoji:"🦸", grad:["#2b5adc","#7fb0ff"],
     en:"Hold to fly, grab stars, dodge clouds.",
     he:"תבנה משחק של גיבור-על שעף בשמיים כשמחזיקים את האצבע, אוסף כוכבים וזהיר מעננים כהים."},
    {id:"hero-fly-v2", label:"v2 ✨", emoji:"🦸", grad:["#2f6bff","#8fd0ff"],
     en:"Flowing cape, sparkle trail, city skyline & storms.",
     he:"שדרג את גיבור-העל: גלימה מתנופפת עם שובל נצנצים, קו-רקיע של עיר בפרלקסה, כוכבים זוהרים עם קפיצת '+1', עננֵי סערה וברקים מסוכנים, רעידת מסך וצלילים."},
  ]},
  {key:"fly", name:"Fly Simulator", emoji:"✈️", versions:[
    {id:"fly-sim", label:"v1", emoji:"✈️", grad:["#4fb8ff","#cdeeff"],
     en:"Steer a cute plane through golden rings.",
     he:"תבנה סימולטור טיסה עם מטוס חמוד שעולה ויורד עם החצים, וצריך לעבור דרך טבעות זהב באוויר."},
    {id:"fly-sim-v2", label:"v2 ✨", emoji:"✈️", grad:["#4fb8ff","#dff3ff"],

  ]},
  {key:"star", name:"Star Catcher", emoji:"🧺", versions:[
    {id:"star-catch", label:"v1", emoji:"🧺", grad:["#7a4bd6","#3a2a6d"],
     en:"Move the basket, catch stars, dodge bombs.",
     he:"תבנה משחק שבו מזיזים סלסלה ימינה ושמאלה כדי לתפוס כוכבים וסוכריות שנופלות, ולהיזהר מהפצצות."},
    {id:"star-catch-v2", label:"v2 ✨", emoji:"🧺", grad:["#8a5be0","#241640"],
     en:"Night sky, combo multiplier, confetti & lives.",
     he:"שדרג את תופס הכוכבים: שמי לילה עם ירח וכוכבים מנצנצים בכמה עומקים, סלסלה שמתנדנדת לפי התנועה, מערכת קומבו עם מכפיל, קונפטי בכל תפיסה, לבבות וצלילים."},
  ]},
];
const app = document.getElementById('app');

// sprites shown in each game's "🎨 Sprites" tab. Arcade games are filled from sprites.json;
// the Build-It Lab games use emoji "sprites" (a real teaching point — they draw with emoji!).
let SPRITES_BY_GAME = {};
const FAM_SPRITES = {
  mario:[{name:'Runner (v1)',emoji:'🏃'},
    {name:'Maki — run 1',src:'games/mario-maki/sprites/maki_0_0.png'},
    {name:'Maki — run 2',src:'games/mario-maki/sprites/maki_0_1.png'},
    {name:'Maki — run 3',src:'games/mario-maki/sprites/maki_0_2.png'},
    {name:'Maki — run 4',src:'games/mario-maki/sprites/maki_0_3.png'},
    {name:'Maki — jump',src:'games/mario-maki/sprites/maki_jump.png'},
    {name:'Mushroom',emoji:'🍄'},{name:'Goomba',emoji:'👾'},{name:'Sushi demon',emoji:'👹'},{name:'Pipe',emoji:'🟩'}],
  bird:[{name:'Bird',emoji:'🐤'},{name:'Pipe',emoji:'🟩'},{name:'Cloud',emoji:'☁️'}],
  hero:[{name:'Super hero',emoji:'🦸'},{name:'Star',emoji:'⭐'},{name:'Storm cloud',emoji:'☁️'},{name:'Bird',emoji:'🦅'}],
  fly:[{name:'Plane',emoji:'✈️'},{name:'Golden ring',emoji:'⭕'},{name:'Eagle',emoji:'🦅'},{name:'Cloud',emoji:'☁️'}],
  star:[{name:'Basket',emoji:'🧺'},{name:'Star',emoji:'⭐'},{name:'Candy',emoji:'🍬'},{name:'Bomb',emoji:'💣'}],
};

function thumbHTML(s){
  const nm=(s.name||'').replace(/'/g,'’');
  return s.src
    ? `<div class="sp-thumb" onclick="openLB('${nm}','${s.src}','')"><img loading="lazy" src="${s.src}" alt="${nm}"></div>`
    : `<div class="sp-thumb" onclick="openLB('${nm}','','${s.emoji}')"><span class="em">${s.emoji}</span></div>`;
}
function spritesPanelHTML(list){
  const items=(list&&list.length)?list.map(thumbHTML).join("")
    :'<p class="en" style="padding:14px;grid-column:1/-1">No sprites for this one yet.</p>';
  return `<div class="tpanel hidden" data-t="sprites">
    <div class="sp-grid">${items}</div>
    <div class="sp-hint">👆 Tap a sprite to zoom in</div></div>`;
}
function switchTab(btn){
  const card=btn.closest('.mcard'), t=btn.dataset.t;
  card.querySelectorAll('.vtab').forEach(b=>b.classList.toggle('on', b.dataset.t===t));
  card.querySelectorAll('.tpanel').forEach(p=>p.classList.toggle('hidden', p.dataset.t!==t));
}
function copyP(btn,text){navigator.clipboard&&navigator.clipboard.writeText(text);
  const o=btn.textContent;btn.textContent='✓ הועתק!';setTimeout(()=>btn.textContent=o,1400);}
function openLB(name,src,emoji){
  document.getElementById('lb-stage').innerHTML = src?`<img src="${src}" alt="">`:`<span class="em">${emoji}</span>`;
  document.getElementById('lb-name').textContent=name;
  document.getElementById('lb').classList.add('on');
}
function closeLB(){document.getElementById('lb').classList.remove('on');}
document.getElementById('lb').addEventListener('click',e=>{if(e.target.id==='lb')closeLB();});
addEventListener('keydown',e=>{if(e.key==='Escape')closeLB();});

function familyHTML(fam){
  const verTabs = fam.versions.map((v,vi)=>
    `<button class="vtab${vi===0?' on':''}" data-t="v${vi}" onclick="switchTab(this)">${v.label}</button>`).join("");
  const sprTab = `<button class="vtab" data-t="sprites" onclick="switchTab(this)">🎨 Sprites</button>`;
  const verPanels = fam.versions.map((v,vi)=>
    `<div class="tpanel${vi===0?'':' hidden'}" data-t="v${vi}">
      <a class="mcover" href="games/${v.id}/index.html"
         style="background:linear-gradient(135deg,${v.grad[0]},${v.grad[1]})">
        <span>${v.emoji}</span><span class="go">▶ Play</span></a>
      <div class="mbody"><p class="en">${v.en}</p>
        <div class="prompt"><div class="lab">🇮🇱 הפרומפט לבנייה:</div>
          <div class="he">${v.he}</div>
          <button class="copy" onclick="copyP(this,\`${v.he}\`)">📋 העתק פרומפט</button>
          <div style="clear:both"></div>
        </div>
      </div>
    </div>`).join("");
  return `<div class="mcard fam">
    <div class="fam-title">${fam.emoji} ${fam.name}
      <span class="fam-count">${fam.versions.length} versions</span></div>
    <div class="vtabs">${verTabs}${sprTab}</div>
    <div class="vwrap">${verPanels}${spritesPanelHTML(FAM_SPRITES[fam.key])}</div>
  </div>`;
}
function cardHTML(g){
  const spr=SPRITES_BY_GAME[g.id]||[];
  return `<div class="mcard">
    <div class="fam-title">${g.title}<span class="fam-count">${g.tag.replace(/^\S+\s/,'')}</span></div>
    <div class="vtabs">
      <button class="vtab on" data-t="play" onclick="switchTab(this)">▶ Play</button>
      <button class="vtab" data-t="sprites" onclick="switchTab(this)">🎨 Sprites${spr.length?' ('+spr.length+')':''}</button>
    </div>
    <div class="vwrap">
      <div class="tpanel" data-t="play">
        <a class="mcover cover-img" href="games/${g.id}/index.html">
          <img loading="lazy" src="games/${g.id}/cover.png" alt="${g.title}">
          <span class="tag">${g.tag}</span><span class="go">▶ Play</span></a>
        <div class="mbody"><p class="en">${g.desc}</p></div>
      </div>
      ${spritesPanelHTML(spr)}
    </div>
  </div>`;
}
function render(filter="all"){
  let html = ZONES.map(z=>{
    if(filter!=="all" && filter!==z.cat) return "";
    const games = GAMES.filter(g=>g.cat===z.cat);
    if(!games.length) return "";
    return `<section class="zone">
      <div class="zone-head"><span class="zone-emoji">${z.emoji}</span>
        <h2 class="zone-title">${z.title}</h2>
        <span class="zone-count">${games.length} game${games.length>1?'s':''}</span></div>
      <div class="grid">${games.map(cardHTML).join("")}</div>
    </section>`;
  }).join("");
  if(filter==="all" || filter==="build"){
    html += `<section class="zone">
      <div class="zone-head"><span class="zone-emoji">🛠️</span>
        <h2 class="zone-title">Build-It Lab · בונים משחקים</h2>
        <span class="zone-count">${FAMILIES.length} games</span></div>
      <div class="grid">${FAMILIES.map(familyHTML).join("")}</div>
    </section>`;
  }
  app.innerHTML = html;
}
document.getElementById('filters').addEventListener('click',e=>{
  const b=e.target.closest('.pill[data-filter]'); if(!b) return;
  document.querySelectorAll('.pill[data-filter]').forEach(p=>p.classList.remove('on'));
  b.classList.add('on'); render(b.dataset.filter);
});
render();
// load real per-game sprites for the arcade games' "🎨 Sprites" tabs, then re-render
fetch('sprites.json').then(r=>r.json()).then(data=>{
  data.forEach(g=>{ SPRITES_BY_GAME[g.game]=g.sprites||[]; });
  const on=document.querySelector('.pill.on');
  render(on?on.dataset.filter:'all');
}).catch(()=>{});
</script>
</body>
</html>
